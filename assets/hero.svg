<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustración ficticia: residencias contemporáneas al atardecer (sin relación con un proyecto real) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142230"/>
      <stop offset=".55" stop-color="#2c4354"/>
      <stop offset=".85" stop-color="#6d7a7c"/>
      <stop offset="1" stop-color="#b79a74"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dcab"/>
      <stop offset="1" stop-color="#d99a55"/>
    </linearGradient>
    <linearGradient id="glassCool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5868"/>
      <stop offset="1" stop-color="#22323f"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b8796"/>
      <stop offset="1" stop-color="#14505c"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4034"/>
      <stop offset="1" stop-color="#15221c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7dde1"/>
      <stop offset="1" stop-color="#b9c2c8"/>
    </linearGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1117" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#0b1117" stop-opacity="0"/>
      <stop offset=".8" stop-color="#0b1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1117" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="slats" width="12" height="10" patternUnits="userSpaceOnUse">
      <rect width="12" height="10" fill="#7b5a3c"/>
      <rect x="9" width="3" height="10" fill="#5d4229"/>
    </pattern>
  </defs>

  <!-- cielo y cordillera -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="960" cy="470" r="34" fill="#e8c48e" opacity=".55"/>
  <path d="M0 470 L90 430 L170 452 L260 402 L360 440 L450 410 L560 446 L660 398 L770 436 L880 404 L990 444 L1090 414 L1200 440 L1200 560 L0 560Z" fill="#33495a" opacity=".85"/>
  <path d="M0 505 L120 476 L230 498 L340 468 L470 500 L590 474 L720 502 L840 478 L960 504 L1080 482 L1200 500 L1200 580 L0 580Z" fill="#253746"/>

  <!-- casa lejana izquierda -->
  <g>
    <rect x="30" y="500" width="210" height="90" fill="#a9b3ba"/>
    <rect x="70" y="462" width="150" height="44" fill="#c3cbd0"/>
    <rect x="62" y="456" width="166" height="8" fill="#dfe4e7"/>
    <rect x="50" y="522" width="90" height="52" fill="url(#glass)" opacity=".9"/>
    <rect x="90" y="472" width="70" height="24" fill="url(#glass)" opacity=".8"/>
    <path d="M95 522V574M50 548H140" stroke="#2b3a45" stroke-width="2"/>
  </g>

  <!-- casa lejana derecha -->
  <g>
    <rect x="900" y="470" width="260" height="120" fill="#b3bcc2"/>
    <rect x="860" y="420" width="220" height="56" fill="#cdd4d8"/>
    <rect x="850" y="412" width="240" height="10" fill="#e6eaec"/>
    <rect x="880" y="432" width="120" height="34" fill="url(#glass)" opacity=".85"/>
    <rect x="1010" y="430" width="56" height="40" fill="url(#slats)"/>
    <rect x="930" y="500" width="150" height="72" fill="url(#glassCool)"/>
    <rect x="1090" y="500" width="50" height="72" fill="url(#glass)" opacity=".8"/>
    <path d="M980 500V572M1030 500V572" stroke="#2b3a45" stroke-width="2"/>
  </g>

  <!-- terreno -->
  <path d="M0 585 Q600 560 1200 585 L1200 900 L0 900Z" fill="url(#lawn)"/>

  <!-- casa principal -->
  <g>
    <!-- sombra proyectada -->
    <path d="M280 640 L900 640 L960 668 L250 668Z" fill="#0c1410" opacity=".55"/>
    <!-- planta baja -->
    <rect x="290" y="470" width="540" height="170" fill="url(#wall)"/>
    <rect x="320" y="498" width="320" height="130" fill="url(#glass)"/>
    <path d="M400 498V628M480 498V628M560 498V628" stroke="#2b3a45" stroke-width="3"/>
    <!-- interior: silueta de mobiliario -->
    <rect x="340" y="586" width="110" height="26" rx="4" fill="#b67a40" opacity=".55"/>
    <rect x="500" y="560" width="8" height="52" fill="#9a6534" opacity=".5"/>
    <circle cx="504" cy="556" r="14" fill="#fff1d4" opacity=".7"/>
    <rect x="660" y="498" width="150" height="142" fill="#a7b0b7"/>
    <rect x="676" y="512" width="40" height="128" fill="#4a3624"/>
    <!-- volumen superior en voladizo -->
    <rect x="410" y="360" width="470" height="116" fill="#e4e8eb"/>
    <rect x="396" y="348" width="498" height="14" fill="#f4f6f7"/>
    <rect x="440" y="384" width="250" height="68" fill="url(#glass)"/>
    <path d="M523 384V452M606 384V452" stroke="#2b3a45" stroke-width="3"/>
    <rect x="710" y="378" width="150" height="88" fill="url(#slats)"/>
    <rect x="410" y="476" width="470" height="10" fill="#0d1419" opacity=".35"/>
    <!-- pilar -->
    <rect x="862" y="476" width="10" height="164" fill="#e4e8eb"/>
    <!-- terraza y piscina -->
    <path d="M250 640 L900 640 L940 662 L220 662Z" fill="#c9c2b4"/>
    <path d="M300 662 L860 662 L900 700 L250 700Z" fill="url(#pool)"/>
    <path d="M360 676 L520 676 M600 684 L760 684 M420 692 L560 692" stroke="#f2c98a" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <path d="M230 700 L920 700 L940 712 L210 712Z" fill="#b8b0a1"/>
  </g>

  <!-- palmeras -->
  <g fill="none" stroke-linecap="round">
    <path d="M190 720 Q180 600 214 470" stroke="#16211b" stroke-width="10"/>
    <g stroke="#1b2a22" stroke-width="7">
      <path d="M214 470 Q170 450 128 470"/><path d="M214 470 Q186 430 150 420"/>
      <path d="M214 470 Q228 424 262 408"/><path d="M214 470 Q256 452 296 470"/>
      <path d="M214 470 Q240 480 270 516"/><path d="M214 470 Q190 486 168 520"/>
    </g>
    <path d="M1010 740 Q1030 620 1000 520" stroke="#16211b" stroke-width="9"/>
    <g stroke="#1b2a22" stroke-width="6">
      <path d="M1000 520 Q960 500 924 516"/><path d="M1000 520 Q978 484 948 474"/>
      <path d="M1000 520 Q1016 478 1048 466"/><path d="M1000 520 Q1040 506 1076 520"/>
      <path d="M1000 520 Q1026 532 1050 564"/><path d="M1000 520 Q980 536 962 566"/>
    </g>
  </g>

  <!-- jardín y camino de acceso -->
  <path d="M640 900 L760 712 L840 712 L820 900Z" fill="#3a4852"/>
  <path d="M0 760 Q140 740 300 770 L300 900 L0 900Z" fill="#1a2b22"/>
  <path d="M900 900 Q1000 760 1200 770 L1200 900Z" fill="#17261e"/>
  <g fill="#f2c98a">
    <circle cx="720" cy="780" r="4"/><circle cx="700" cy="830" r="4"/><circle cx="680" cy="880" r="4"/>
    <circle cx="850" cy="780" r="4"/><circle cx="858" cy="830" r="4"/><circle cx="866" cy="880" r="4"/>
  </g>

  <rect width="1200" height="900" fill="url(#vign)"/>
</svg>
